services:
  ollama:
    image: ollama/ollama:latest
    container_name: matcha-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  qdrant:
    image: qdrant/qdrant:latest
    container_name: matcha-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage

  valkey:
    image: valkey/valkey:8-alpine
    container_name: matcha-valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkey-data:/data

  telegram-bot:
    build: .
    container_name: matcha-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-matcha_knowledge}
      VALKEY_URL: redis://valkey:6379/0
      SESSION_TTL: ${SESSION_TTL:-86400}
      SESSION_MAX_TURNS: ${SESSION_MAX_TURNS:-10}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
    depends_on:
      - ollama
      - qdrant
      - valkey

volumes:
  ollama-data:
  qdrant-data:
  valkey-data:
